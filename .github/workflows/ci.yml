name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs with no secrets and no database. Everything below has to pass on a
# clean checkout, which is why the unit suite is pure and the one check that
# needs Docker lives in `pnpm db:verify` instead.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Must stay >= 22.13: pnpm 11 uses the node:sqlite built-in module, which
      # does not exist in Node 20, so the runner would fail before installing
      # anything. 24 also matches the version used for local development, which
      # keeps CI from diverging from what is actually tested by hand.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile fails if the lockfile and package.json disagree, so a
      # dependency change cannot reach main without the lockfile that proves it
      # installs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The dashboard renders at request time, so the production build must
      # succeed without database credentials.
      - name: Production build
        run: pnpm build
